<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
          authDomain: "zeg-g-tournament.firebaseapp.com",
          projectId: "zeg-g-tournament",
          storageBucket: "zeg-g-tournament.firebasestorage.app",
          messagingSenderId: "907178832675",
          appId: "1:907178832675:web:414bc01f1b3a4695455296",
          measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;
        let selectedMatchForJoin = null;

        window.switchTab = function(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
            
            if(tabId === 'matchSection') { document.getElementById('matchSection').classList.add('active'); loadWebMatches(); }
            if(tabId === 'myMatchSection') { document.getElementById('myMatchSection').classList.add('active'); loadMyMatches(); }
            if(tabId === 'addBalance') { document.getElementById('addBalanceSection').classList.add('active'); loadUserHistory(); }
            if(tabId === 'withdraw') { document.getElementById('withdrawSection').classList.add('active'); loadUserHistory(); }
        }

        window.toggleDrawer = function() { document.getElementById('sideDrawer').classList.toggle('open'); }
        window.openAuthModal = function() { document.getElementById('authModal').style.display = 'flex'; }
        window.closeAuthModal = function() { document.getElementById('authModal').style.display = 'none'; }
        window.closeJoinModal = function() { document.getElementById('joinModal').style.display = 'none'; }

        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById('modalTitle').innerText = isLoginMode ? "Login to ZEG-G" : "Register New Account";
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? "Login" : "Sign Up";
            document.getElementById('switchText').innerHTML = isLoginMode ? "Don't have an account? <span>Register</span>" : "Already have an account? <span>Login</span>";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if(!email || !password) { alert("সব তথ্য পূরণ করুন।"); return; }
            try {
                if(isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("Logged In Successfully!");
                } else {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), { email: email, balance: 0.00 });
                    alert("Account Created!");
                }
                closeAuthModal();
            } catch (e) { alert("Error: " + e.message); }
        }

        onAuthStateChanged(auth, (user) => {
            const authNavBtn = document.getElementById('authNavBtn');
            const drawerAuthItem = document.getElementById('drawerAuthItem');
            if(user) {
                authNavBtn.innerText = "Logout"; authNavBtn.onclick = () => signOut(auth);
                drawerAuthItem.innerText = "Logout"; drawerAuthItem.onclick = () => signOut(auth);
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if(docSnap.exists()) document.getElementById('userBalance').innerText = `৳${docSnap.data().balance || 0.00}`;
                });
                loadUserHistory();
            } else {
                authNavBtn.innerText = "Login"; authNavBtn.onclick = openAuthModal;
                drawerAuthItem.innerText = "Login / Register"; drawerAuthItem.onclick = openAuthModal;
                document.getElementById('userBalance').innerText = "৳0.00";
            }
            loadWebMatches();
            loadMyMatches();
        });

        function startCountdown(matchTimeStr, elementId) {
            const countDownDate = new Date(matchTimeStr).getTime();
            if(isNaN(countDownDate)) { document.getElementById(elementId).innerText = "Time Expired"; return; }

            const x = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                if (distance < 0) {
                    clearInterval(x);
                    document.getElementById(elementId).innerText = "Match Started / Running";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                let timeStr = "";
                if(days > 0) timeStr += days + "d ";
                timeStr += hours + "h " + minutes + "m " + seconds + "s";
                
                const el = document.getElementById(elementId);
                if(el) el.innerText = timeStr;
                else clearInterval(x);
            }, 1000);
        }

        async function loadWebMatches() {
            const container = document.getElementById('matchListContainer');
            try {
                const snap = await getDocs(collection(db, "matches"));
                if(snap.empty) {
                    container.innerHTML = `<p style="color: var(--text-muted);">No matches available.</p>`;
                    return;
                }

                // ইউজার অলরেডি কোন কোন ম্যাচে জয়েন করেছে তা চেক করার জন্য ফেচ করা
                let joinedMatchCodes = [];
                if(auth.currentUser) {
                    const regQuery = query(collection(db, "matchRegistrations"), where("userId", "==", auth.currentUser.uid));
                    const regSnap = await getDocs(regQuery);
                    regSnap.forEach(doc => {
                        joinedMatchCodes.push(doc.data().matchCode);
                    });
                }

                container.innerHTML = "";
                snap.forEach((d) => {
                    const m = d.data();
                    const joined = m.joinedCount || 0;
                    const total = m.totalSlots || 0;
                    const isFull = joined >= total;
                    const hasJoinedAlready = joinedMatchCodes.includes(m.matchCode);

                    // রুম আইডি ও পাসওয়ার্ড লজিক (শুধুমাত্র জয়েন করা ইউজার দেখতে পাবে)
                    let roomInfoHtml = "";
                    if(hasJoinedAlready) {
                        if(m.roomId && m.roomId.trim() !== "") {
                            roomInfoHtml = `
                                <div style="margin-top: 8px; padding: 10px; background: rgba(0,255,102,0.1); border: 1px solid var(--neon-green); border-radius: 6px; color: var(--neon-green); font-size: 13px;">
                                    <strong>Room ID:</strong> ${m.roomId} <br>
                                    <strong>Password:</strong> ${m.roomPass || 'N/A'}
                                </div>`;
                        } else {
                            roomInfoHtml = `
                                <div style="margin-top: 8px; padding: 8px; background: rgba(0,243,255,0.05); border-left: 3px solid var(--neon-cyan); border-radius: 4px; color: var(--text-muted); font-size: 12px;">
                                    ম্যাচ শুরু হওয়ার ২-৩ মিনিট আগে রুম আইডি ও পাসওয়ার্ড দেওয়া হবে।
                                </div>`;
                        }
                    }

                    // বাটন স্ট্যাটাস নির্ধারণ
                    let btnStyle = "";
                    let btnText = "Join Match";
                    let isDisabled = false;

                    if(hasJoinedAlready) {
                        btnStyle = 'style="background: #374151; color: var(--neon-green); cursor: not-allowed;"';
                        btnText = '✓ Already Joined';
                        isDisabled = true;
                    } else if(isFull) {
                        btnStyle = 'style="background: gray; cursor: not-allowed;"';
                        btnText = 'Match Full';
                        isDisabled = true;
                    } else {
                        btnStyle = 'style="background: var(--neon-green); color: #000; cursor: pointer;"';
                    }

                    const timerId = `timer_${m.matchCode}`;
                    container.innerHTML += `
                        <div class="match-card">
                            <h4>${m.matchName} (Code: ${m.matchCode})</h4>
                            <div class="match-details">
                                <span>Entry Fee: ৳${m.entryFee}</span>
                                <span>Prize: ৳${m.firstPrize}</span>
                            </div>
                            <div class="match-details">
                                <span>Slots: ${joined}/${total}</span>
                                <span style="color: var(--neon-cyan);">Starts In: <strong id="${timerId}" style="color: var(--neon-pink);">Calculating...</strong></span>
                            </div>
                            ${roomInfoHtml}
                            <button class="join-btn" ${btnStyle} ${isDisabled ? 'disabled' : ''} onclick="${isDisabled ? '' : `openJoinModal('${m.matchCode}', '${m.matchName}',${m.entryFee})`}">${btnText}</button>
                        </div>`;
                    
                    if(m.matchTime) startCountdown(m.matchTime, timerId);
                });
            } catch(e) { console.error(e); }
        }

        window.openJoinModal = function(code, name, fee) {
            if(!auth.currentUser) { alert("প্রথমে লগইন করুন!"); openAuthModal(); return; }
            selectedMatchForJoin = { code, name, fee };
            document.getElementById('joinMatchInfo').innerText = `${name} (Fee: ৳${fee})`;
            document.getElementById('gamePlayerName').value = "";
            document.getElementById('gamePlayerID').value = "";
            document.getElementById('joinModal').style.display = 'flex';
        }

        window.confirmJoinMatch = async function() {
            const playerName = document.getElementById('gamePlayerName').value.trim();
            const playerID = document.getElementById('gamePlayerID').value.trim();

            if(!playerName || !playerID) { alert("Game Name ebong ID দিন।"); return; }

            const userRef = doc(db, "users", auth.currentUser.uid);
            const userSnap = await getDoc(userRef);
            const userBal = Number(userSnap.data().balance || 0);

            if(userBal < selectedMatchForJoin.fee) {
                alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই! দয়া করে Add Balance করুন।");
                closeJoinModal();
                switchTab('addBalance');
                return;
            }

            try {
                // ডাবল চেক যেন সাবমিট করার সময়ও ইউজার আগে জয়েন করা না থাকে
                const checkQuery = query(collection(db, "matchRegistrations"), where("userId", "==", auth.currentUser.uid), where("matchCode", "==", selectedMatchForJoin.code));
                const checkSnap = await getDocs(checkQuery);
                if(!checkSnap.empty) {
                    alert("আপনি ইতিমধ্যে এই ম্যাচে জয়েন করেছেন!");
                    closeJoinModal();
                    return;
                }

                await updateDoc(userRef, { balance: userBal - selectedMatchForJoin.fee });

                const matchRef = doc(db, "matches", selectedMatchForJoin.code);
                const matchSnap = await getDoc(matchRef);
                const currentJoined = matchSnap.data().joinedCount || 0;
                await updateDoc(matchRef, { joinedCount: currentJoined + 1 });

                await addDoc(collection(db, "matchRegistrations"), {
                    userId: auth.currentUser.uid,
                    matchCode: selectedMatchForJoin.code,
                    matchName: selectedMatchForJoin.name,
                    playerName: playerName,
                    playerID: playerID,
                    timestamp: new Date()
                });

                alert("Successfully joined the match!");
                closeJoinModal();
                loadWebMatches();
                loadMyMatches();
            } catch(e) { alert("Error: " + e.message); }
        }

        async function loadMyMatches() {
            const container = document.getElementById('myMatchListContainer');
            if(!auth.currentUser) {
                container.innerHTML = `<p style="color: var(--text-muted);">Please login to view your joined matches.</p>`;
                return;
            }
            try {
                const q = query(collection(db, "matchRegistrations"), where("userId", "==", auth.currentUser.uid));
                const snap = await getDocs(q);
                if(snap.empty) {
                    container.innerHTML = `<p style="color: var(--text-muted);">You haven't joined any matches yet.</p>`;
                } else {
                    container.innerHTML = "";
                    snap.forEach(d => {
                        const reg = d.data();
                        container.innerHTML += `
                            <div class="match-card">
                                <h4>${reg.matchName} (Code: ${reg.matchCode})</h4>
                                <div class="match-details">
                                    <span>Game Name: ${reg.playerName}</span>
                                    <span>Game ID: ${reg.playerID}</span>
                                </div>
                                <p style="color: var(--neon-green); font-size: 13px;">Status: Joined Successfully</p>
                            </div>`;
                    });
                }
            } catch(e) {}
        }

        async function loadUserHistory() {
            if(!auth.currentUser) return;
            
            const addHistContainer = document.getElementById('addBalanceHistory');
            const qAdd = query(collection(db, "addBalanceRequests"), where("userId", "==", auth.currentUser.uid));
            const snapAdd = await getDocs(qAdd);
            addHistContainer.innerHTML = snapAdd.empty ? `<p style="color: var(--text-muted); font-size: 12px;">No requests found.</p>` : "";
            snapAdd.forEach(d => {
                const item = d.data();
                let statusText = item.status === 'Approved' ? 'Approved' : (item.status === 'Fail' ? 'Fail' : 'Pending');
                let color = item.status === 'Approved' ? 'var(--neon-green)' : (item.status === 'Fail' ? 'var(--neon-pink)' : 'var(--neon-cyan)');
                addHistContainer.innerHTML += `
                    <div class="history-item">
                        <div>Trx: ${item.trxId} | ৳${item.amount}</div>
                        <div style="font-weight: bold; color: ${color};">${statusText}</div>
                    </div>`;
            });

            const withHistContainer = document.getElementById('withdrawHistory');
            const qWith = query(collection(db, "withdrawRequests"), where("userId", "==", auth.currentUser.uid));
            const snapWith = await getDocs(qWith);
            withHistContainer.innerHTML = snapWith.empty ? `<p style="color: var(--text-muted); font-size: 12px;">No requests found.</p>` : "";
            snapWith.forEach(d => {
                const item = d.data();
                let statusText = item.status === 'Approved' ? 'Approved' : (item.status === 'Fail' ? 'Fail' : 'Pending');
                let color = item.status === 'Approved' ? 'var(--neon-green)' : (item.status === 'Fail' ? 'var(--neon-pink)' : 'var(--neon-cyan)');
                withHistContainer.innerHTML += `
                    <div class="history-item">
                        <div>No: ${item.number} | ৳${item.amount}</div>
                        <div style="font-weight: bold; color: ${color};">${statusText}</div>
                    </div>`;
            });
        }

        window.submitAddBalance = async function() {
            if(!auth.currentUser) { alert("প্রথমে লগইন করুন!"); openAuthModal(); return; }
            const trxId = document.getElementById('bkashTrxID').value.trim();
            const amount = Number(document.getElementById('addAmount').value);

            if(!trxId || !amount) { alert("TrxID ebong Amount দিন।"); return; }
            if(amount < 5 || amount > 100) { alert("Add Balance minimum ৳5 ebong maximum ৳100 hote hobe."); return; }

            try {
                await addDoc(collection(db, "addBalanceRequests"), {
                    userId: auth.currentUser.uid, email: auth.currentUser.email,
                    trxId: trxId, amount: amount, status: 'Pending', timestamp: new Date()
                });
                alert("Request sent!");
                document.getElementById('bkashTrxID').value = ""; document.getElementById('addAmount').value = "";
                loadUserHistory();
            } catch(e) {}
        }

        window.submitWithdraw = async function() {
            if(!auth.currentUser) { alert("প্রথমে লগইন করুন!"); openAuthModal(); return; }
            const number = document.getElementById('withdrawNumber').value.trim();
            const amount = Number(document.getElementById('withdrawAmount').value);

            if(!number || !amount) { alert("Number ebong Amount দিন।"); return; }
            if(amount < 30 || amount > 200) { alert("Withdraw limit: Minimum ৳30 ebong Maximum ৳200"); return; }

            const userRef = doc(db, "users", auth.currentUser.uid);
            const userSnap = await getDoc(userRef);
            const currentBal = Number(userSnap.data().balance || 0);

            if(currentBal < amount) {
                alert("আপনার পর্যাপ্ত ব্যালেন্স নেই।");
                return;
            }

            try {
                await updateDoc(userRef, { balance: currentBal - amount });

                await addDoc(collection(db, "withdrawRequests"), {
                    userId: auth.currentUser.uid, email: auth.currentUser.email,
                    number: number, amount: amount, status: 'Pending', timestamp: new Date()
                });

                alert("উইথড্র রিকুয়েষ্ট গ্রহন করা হলো।");
                document.getElementById('withdrawNumber').value = ""; document.getElementById('withdrawAmount').value = "";
                loadUserHistory();
            } catch(e) { alert("Error: " + e.message); }
        }
</script>
