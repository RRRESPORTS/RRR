<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Eports</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid rgba(0,243,255,0.2); }
        .logo { font-size: 20px; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--neon-green); }

        /* Sidebar / Drawer */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0; background-color: #111827; overflow-x: hidden; transition: 0.3s; padding-top: 60px; border-right: 1px solid var(--neon-cyan); }
        .sidebar a { padding: 12px 25px; text-decoration: none; font-size: 16px; color: var(--text-main); display: block; transition: 0.2s; border-bottom: 1px solid #1f2937; }
        .sidebar a:hover { background: #1f2937; color: var(--neon-cyan); }
        .sidebar .closebtn { position: absolute; top: 15px; right: 20px; font-size: 30px; color: var(--neon-pink); border: none; }

        /* Main Container */
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .wallet-card { background: linear-gradient(135deg, #111827, #1f2937); border: 1px solid var(--neon-cyan); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,243,255,0.1); }
        .wallet-card h2 { color: var(--neon-green); font-size: 28px; margin-top: 5px; }

        /* Sections & Cards */
        .section-title { font-size: 18px; color: var(--neon-cyan); margin-bottom: 10px; border-left: 4px solid var(--neon-green); padding-left: 8px; }
        .match-card { background: var(--card-bg); border: 1px solid #374151; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-card h3 { color: var(--text-main); font-size: 16px; margin-bottom: 5px; }
        .match-info { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        
        .btn { width: 100%; padding: 10px; background: var(--neon-green); color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; display: block; text-decoration: none; }
        .btn:hover { opacity: 0.9; }
        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 14px; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--neon-cyan); padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; position: relative; }
        .close-modal { float: right; font-size: 24px; color: var(--neon-pink); cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZEG-G Eports</div>
        <div class="menu-btn" onclick="openNav()">&#9776;</div>
    </header>

    <!-- Sidebar Menu -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#" onclick="openModal('profileModal'); closeNav();">👤 My Profile</a>
        <a href="#" onclick="openModal('addBalModal'); closeNav();">➕ Add Balance</a>
        <a href="#" onclick="openModal('withdrawModal'); closeNav();">💸 Withdraw</a>
        <a href="#" onclick="openModal('giftCodeModal'); closeNav();">🎁 Gift Code</a>
        <a href="#" onclick="logoutUser()">🚪 Logout</a>
    </div>

    <div class="container">
        <!-- Wallet Balance Card -->
        <div class="wallet-card">
            <p style="color: var(--text-muted);">Total Balance</p>
            <h2 id="userBalance">৳0.00</h2>
        </div>

        <div class="section-title">Running Matches</div>
        <div id="matchList">
            <p style="color: var(--text-muted); text-align: center;">Loading matches...</p>
        </div>
    </div>

    <!-- Modals -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('profileModal')">&times;</span>
            <h3 style="color: var(--neon-cyan); margin-bottom: 15px;">My Profile</h3>
            <p><strong>Name:</strong> <span id="pName">N/A</span></p>
            <p><strong>Game UID:</strong> <span id="pUID">N/A</span></p>
            <p><strong>Phone:</strong> <span id="pPhone">N/A</span></p>
        </div>
    </div>

    <div id="addBalModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('addBalModal')">&times;</span>
            <h3 style="color: var(--neon-cyan); margin-bottom: 15px;">Add Balance</h3>
            <input type="number" id="addAmount" class="form-control" placeholder="Amount (৳)">
            <input type="text" id="addTrxId" class="form-control" placeholder="Bkash/Nagad TrxID">
            <button class="btn" onclick="submitAddBalance()">Submit Request</button>
        </div>
    </div>

    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('withdrawModal')">&times;</span>
            <h3 style="color: var(--neon-cyan); margin-bottom: 15px;">Withdraw Request</h3>
            <input type="number" id="withAmount" class="form-control" placeholder="Amount (৳)">
            <input type="text" id="withNumber" class="form-control" placeholder="Bkash/Nagad Number">
            <button class="btn" onclick="submitWithdraw()">Withdraw</button>
        </div>
    </div>

    <div id="giftCodeModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('giftCodeModal')">&times;</span>
            <h3 style="color: var(--neon-cyan); margin-bottom: 15px;">Redeem Gift Code</h3>
            <input type="text" id="redeemCodeText" class="form-control" placeholder="Enter Gift Code">
            <button class="btn" onclick="redeemGiftCode()">Redeem</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
          authDomain: "zeg-g-tournament.firebaseapp.com",
          projectId: "zeg-g-tournament",
          storageBucket: "zeg-g-tournament.firebasestorage.app",
          messagingSenderId: "907178832675",
          appId: "1:907178832675:web:414bc01f1b3a4695455296",
          measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openNav = function() { document.getElementById("mySidebar").style.width = "250px"; }
        window.closeNav = function() { document.getElementById("mySidebar").style.width = "0"; }
        window.openModal = function(id) { document.getElementById(id).style.display = "flex"; }
        window.closeModal = function(id) { document.getElementById(id).style.display = "none"; }
        window.logoutUser = function() { localStorage.clear(); location.reload(); }

        const currentUserId = localStorage.getItem("userId");

        window.onload = async function() {
            if(!currentUserId) {
                alert("Please login first!");
                window.location.href = "login.html"; // Adjust to your login file
                return;
            }
            loadUserData();
            loadMatches();
        }

        async function loadUserData() {
            const userSnap = await getDoc(doc(db, "users", currentUserId));
            if(userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById("userBalance").innerText = `৳${data.balance || 0}`;
                document.getElementById("pName").innerText = data.playerName || 'N/A';
                document.getElementById("pUID").innerText = data.playerUID || 'N/A';
                document.getElementById("pPhone").innerText = data.phoneNumber || 'N/A';
            }
        }

        async function loadMatches() {
            const list = document.getElementById("matchList");
            const snap = await getDocs(collection(db, "matches"));
            list.innerHTML = snap.empty ? `<p style="color:var(--text-muted); text-align:center;">No matches available.</p>` : "";
            snap.forEach(d => {
                const m = d.data();
                list.innerHTML += `
                    <div class="match-card">
                        <h3>${m.matchName}</h3>
                        <div class="match-info">Entry Fee: ৳${m.entryFee} | Prize: ${m.firstPrize}</div>
                        <div class="match-info" style="color:var(--neon-cyan);">Room ID: ${m.roomId || 'Pending'} | Pass: ${m.roomPass || 'Pending'}</div>
                    </div>`;
            });
        }

        window.submitAddBalance = async function() {
            const amount = Number(document.getElementById("addAmount").value);
            const trxId = document.getElementById("addTrxId").value.trim();
            if(!amount || !trxId) { alert("Fill all fields!"); return; }

            try {
                await setDoc(doc(collection(db, "addBalanceRequests")), {
                    userId: currentUserId, amount: amount, trxId: trxId, status: 'Pending', time: new Date()
                });
                alert("Balance request submitted!");
                closeModal('addBalModal');
            } catch(e) { alert("Error: " + e.message); }
        }

        window.submitWithdraw = async function() {
            const amount = Number(document.getElementById("withAmount").value);
            const number = document.getElementById("withNumber").value.trim();
            if(!amount || !number) { alert("Fill all fields!"); return; }

            const userSnap = await getDoc(doc(db, "users", currentUserId));
            let currentBal = Number(userSnap.data().balance || 0);
            if(amount > currentBal) { alert("Insufficient balance!"); return; }

            try {
                await updateDoc(doc(db, "users", currentUserId), { balance: currentBal - amount });
                await setDoc(doc(collection(db, "withdrawRequests")), {
                    userId: currentUserId, amount: amount, number: number, status: 'Pending', time: new Date()
                });
                alert("Withdraw request submitted!");
                closeModal('withdrawModal');
                loadUserData();
            } catch(e) { alert("Error: " + e.message); }
        }

        window.redeemGiftCode = async function() {
            const code = document.getElementById("redeemCodeText").value.trim();
            if(!code) { alert("Enter gift code!"); return; }

            try {
                const codeRef = doc(db, "giftCodes", code);
                const codeSnap = await getDoc(codeRef);
                if(!codeSnap.exists()) { alert("Invalid gift code!"); return; }

                const data = codeSnap.data();
                if(data.isUsed) { alert("This code is already used!"); return; }

                const userSnap = await getDoc(doc(db, "users", currentUserId));
                let currentBal = Number(userSnap.data().balance || 0);

                await updateDoc(doc(db, "users", currentUserId), { balance: currentBal + Number(data.amount) });
                await updateDoc(codeRef, { isUsed: true });

                alert(`Successfully redeemed ৳${data.amount}!`);
                closeModal('giftCodeModal');
                loadUserData();
            } catch(e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>
