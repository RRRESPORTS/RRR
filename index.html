<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Eports</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }
        
        .header { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,243,255,0.2); }
        .header h1 { color: var(--neon-cyan); font-size: 20px; text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        .balance-badge { background: #1f2937; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--neon-green); font-size: 14px; font-weight: bold; color: var(--neon-green); }

        /* 3-Line Menu Drawer Style */
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--neon-cyan); }
        .drawer { position: fixed; left: -260px; top: 0; width: 260px; height: 100%; background: var(--card-bg); z-index: 1000; transition: 0.3s; border-right: 1px solid rgba(0,243,255,0.3); padding-top: 20px; }
        .drawer.active { left: 0; }
        .drawer-header { padding: 15px 20px; font-size: 18px; color: var(--neon-cyan); border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center; }
        .drawer-item { padding: 15px 20px; display: block; color: var(--text-main); text-decoration: none; border-bottom: 1px solid #1f2937; transition: 0.2s; }
        .drawer-item:hover { background: #1f2937; color: var(--neon-cyan); }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card-bg); border: 1px solid #374151; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card h3 { color: var(--neon-cyan); margin-bottom: 10px; font-size: 16px; }

        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 14px; }
        .form-control:focus { border-color: var(--neon-cyan); outline: none; }
        .btn { width: 100%; padding: 11px; background: var(--neon-green); color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); border: 2px solid var(--neon-cyan); border-radius: 12px; width: 90%; max-width: 400px; padding: 20px; position: relative; }
        .close-btn { color: var(--neon-pink); float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="menu-btn" onclick="toggleDrawer()">&#9776;</div>
            <h1>ZEG-G Eports</h1>
        </div>
        <div class="balance-badge" id="userBalDisplay">৳ 0</div>
    </div>

    <!-- 3-Line Drawer Menu -->
    <div class="drawer" id="navDrawer">
        <div class="drawer-header">
            <span>Menu</span>
            <span style="cursor:pointer; color:var(--neon-pink);" onclick="toggleDrawer()">&times;</span>
        </div>
        <a href="#" class="drawer-item" onclick="openModal('profileModal'); toggleDrawer();">My Profile</a>
        <a href="#" class="drawer-item" onclick="openModal('giftCodeModal'); toggleDrawer();">Gift Code Redeem</a>
        <a href="admin.html" class="drawer-item" style="color: var(--neon-pink);">Admin Panel</a>
    </div>

    <div class="container">
        <!-- Match List Area -->
        <div class="card">
            <h3>Running Matches</h3>
            <div id="userMatchList"><p style="color:var(--text-muted); text-align:center;">Loading matches...</p></div>
        </div>

        <!-- Add Balance Request Card -->
        <div class="card">
            <h3>Add Balance (Bkash/Nagad)</h3>
            <input type="text" id="addTrxId" class="form-control" placeholder="Transaction ID (TrxID)">
            <input type="number" id="addAmount" class="form-control" placeholder="Amount (৳)">
            <button class="btn" onclick="submitAddBalance()">Submit Request</button>
        </div>

        <!-- Withdraw Request Card -->
        <div class="card">
            <h3>Withdraw Balance</h3>
            <input type="text" id="withdrawNum" class="form-control" placeholder="Bkash/Nagad Number">
            <input type="number" id="withdrawAmount" class="form-control" placeholder="Amount (৳)">
            <button class="btn" style="background:var(--neon-cyan);" onclick="submitWithdraw()">Withdraw Request</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <h3 style="color:var(--neon-cyan); margin-bottom:15px;">My Profile</h3>
            <div id="profileDetails" style="font-size:14px; line-height: 1.8;">Loading profile...</div>
        </div>
    </div>

    <!-- Gift Code Modal -->
    <div id="giftCodeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('giftCodeModal')">&times;</span>
            <h3 style="color:var(--neon-cyan); margin-bottom:15px;">Redeem Gift Code</h3>
            <input type="text" id="redeemCodeInput" class="form-control" placeholder="Enter Gift Code">
            <button class="btn" onclick="redeemGiftCode()">Redeem Now</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, getDoc, query, where, addTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
          authDomain: "zeg-g-tournament.firebaseapp.com",
          projectId: "zeg-g-tournament",
          storageBucket: "zeg-g-tournament.firebasestorage.app",
          messagingSenderId: "907178832675",
          appId: "1:907178832675:web:414bc01f1b3a4695455296",
          measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Dummy Local User for testing demo integration (replace with real auth ID if needed)
        let currentUserId = localStorage.getItem("zeg_user_id");
        if(!currentUserId) {
            currentUserId = "user_" + Math.random().toString(36.substring(2, 9));
            localStorage.setItem("zeg_user_id", currentUserId);
            // Initialize user doc
            setDoc(doc(db, "users", currentUserId), {
                userId: currentUserId,
                playerUID: "12345678",
                playerName: "Demo Player",
                balance: 100,
                isBlocked: false
            });
        }

        window.toggleDrawer = function() {
            document.getElementById("navDrawer").classList.toggle("active");
        }

        window.openModal = function(id) { document.getElementById(id).style.display = "flex"; loadProfileData(); }
        window.closeModal = function(id) { document.getElementById(id).style.display = "none"; }

        // Load User Info
        async function loadProfileData() {
            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            if(snap.exists()) {
                const u = snap.data();
                document.getElementById("userBalDisplay").innerText = "৳ " + (u.balance || 0);
                document.getElementById("profileDetails").innerHTML = `
                    <strong>Name:</strong> ${u.playerName || 'N/A'}<br>
                    <strong>Game UID:</strong> ${u.playerUID || 'N/A'}<br>
                    <strong>Balance:</strong> ৳${u.balance || 0}<br>
                    <strong>Status:</strong> ${u.isBlocked ? '<span style="color:red">Blocked</span>' : '<span style="color:green">Active</span>'}
                `;
            }
        }
        loadProfileData();

        // Submit Add Balance Request
        window.submitAddBalance = async function() {
            const trxId = document.getElementById("addTrxId").value.trim();
            const amount = Number(document.getElementById("addAmount").value);
            if(!trxId || !amount) { alert("সব তথ্য দিন।"); return; }

            try {
                await setDoc(doc(collection(db, "addBalanceRequests")), {
                    userId: currentUserId, trxId: trxId, amount: amount, status: "Pending", time: new Date()
                });
                alert("ব্যালেন্স রিকুয়েস্ট সাবমিট হয়েছে!");
                document.getElementById("addTrxId").value = "";
                document.getElementById("addAmount").value = "";
            } catch(e) { alert("Error: " + e.message); }
        }

        // Submit Withdraw Request
        window.submitWithdraw = async function() {
            const number = document.getElementById("withdrawNum").value.trim();
            const amount = Number(document.getElementById("withdrawAmount").value);
            if(!number || !amount) { alert("সব তথ্য দিন।"); return; }

            const userRef = doc(db, "users", currentUserId);
            const snap = await getDoc(userRef);
            let bal = snap.exists() ? Number(snap.data().balance || 0) : 0;

            if(bal < amount) { alert("পর্যাপ্ত ব্যালেন্স নেই!"); return; }

            try {
                // Cut balance instantly on request
                await updateDoc(userRef, { balance: bal - amount });
                await setDoc(doc(collection(db, "withdrawRequests")), {
                    userId: currentUserId, number: number, amount: amount, status: "Pending", time: new Date()
                });
                alert("উইথড্র রিকুয়েস্ট সফল হয়েছে!");
                loadProfileData();
                document.getElementById("withdrawNum").value = "";
                document.getElementById("withdrawAmount").value = "";
            } catch(e) { alert("Error: " + e.message); }
        }

        // Redeem Gift Code
        window.redeemGiftCode = async function() {
            const code = document.getElementById("redeemCodeInput").value.trim();
            if(!code) { alert("গিফট কোড লিখুন।"); return; }

            try {
                const codeRef = doc(db, "giftCodes", code);
                const codeSnap = await getDoc(codeRef);
                if(!codeSnap.exists()) { alert("ভুল গিফট কোড!"); return; }

                const data = codeSnap.data();
                if(data.isUsed) { alert("এই কোডটি ইতিমধ্যে ব্যবহার করা হয়েছে!"); return; }

                // Mark code as used
                await updateDoc(codeRef, { isUsed: true });

                // Add balance to user
                const userRef = doc(db, "users", currentUserId);
                const userSnap = await getDoc(userRef);
                let bal = userSnap.exists() ? Number(userSnap.data().balance || 0) : 0;
                await updateDoc(userRef, { balance: bal + Number(data.amount) });

                alert(`সফল! আপনি ৳${data.amount} বোনাস পেয়েছেন।`);
                closeModal('giftCodeModal');
                loadProfileData();
            } catch(e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>
