<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-TOURNAMENT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20">

    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">AG-TOURNAMENT</h1>
        <div class="flex items-center gap-3">
            <button id="loginBtn" onclick="googleLogin()" class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-lg text-sm font-semibold transition">Login</button>
            <button id="adminToggleBtn" onclick="toggleAdminPanel()" class="hidden bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Admin</button>
            <button onclick="logout()" id="logoutBtn" class="hidden bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Logout</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Balance & Status Card -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-lg">
            <div>
                <p class="text-xs text-slate-400">Total Balance</p>
                <h2 class="text-2xl font-black text-emerald-400">৳ <span id="userBalance">0</span></h2>
            </div>
            <div class="space-x-2">
                <button class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-sm transition">Add Balance</button>
            </div>
        </div>

        <!-- Notice Board Section -->
        <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex items-start gap-3">
            <span class="bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded uppercase tracking-wider">NOTICE</span>
            <p id="noticeDisplay" class="text-sm text-amber-200 font-medium">Loading Notice...</p>
        </div>

        <!-- Admin Control Panel (Hidden by default) -->
        <div id="adminPanel" class="hidden bg-slate-800 border border-emerald-500/40 rounded-xl p-4 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-emerald-400 border-b border-slate-700 pb-2">🛠️ Admin Control Panel</h3>
            
            <!-- Notice Update Form -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">Update Notice Board</label>
                <div class="flex gap-2">
                    <input type="text" id="noticeInput" placeholder="Write new notice..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <button onclick="updateNotice()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">Save</button>
                </div>
            </div>

            <!-- Add Match Form -->
            <div class="space-y-3 pt-2 border-t border-slate-700">
                <h4 class="text-sm font-bold text-slate-200">Add New Match</h4>
                <input type="text" id="matchTitle" placeholder="Match Title (e.g., Free Fire Solo)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="matchEntry" placeholder="Entry Fee (৳)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="number" id="matchPrize" placeholder="Prize Pool (৳)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="maxSlots" placeholder="Max Slots (e.g. 50)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="datetime-local" id="matchTime" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-300">
                </div>
                <button onclick="addNewMatch()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-slate-900 font-bold py-2 rounded-lg text-sm transition">Create Match</button>
            </div>
        </div>

        <!-- Tournaments List Heading -->
        <div class="pt-2">
            <h3 class="text-base font-bold text-slate-200">Live Tournaments</h3>
        </div>

        <!-- Tournaments Container -->
        <div id="tournamentsList" class="space-y-4">
            <!-- Dynamic Matches will load here -->
        </div>
    </main>

    <!-- Firebase & App Logic Script -->
    <script>
        // Your Firebase Configuration (Replace with your actual project config if needed)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForAGTournament",
            authDomain: "ag-tournament-999.firebaseapp.com",
            projectId: "ag-tournament-999",
            storageBucket: "ag-tournament-999.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Admin Email List (Add your admin email here)
        const adminEmails = ["abujar2578@gmail.com"]; 

        let currentUser = null;

        // Auth State Listener
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                
                // Check if admin
                if (adminEmails.includes(user.email)) {
                    document.getElementById('adminToggleBtn').classList.remove('hidden');
                }
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('adminToggleBtn').classList.add('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
            }
        });

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                alert("Login Failed: " + error.message);
            });
        }

        function logout() {
            auth.signOut();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        // Realtime Notice Fetcher & Updater
        db.collection("settings").doc("notice").onSnapshot((doc) => {
            if (doc.exists) {
                document.getElementById('noticeDisplay').innerText = doc.data().text;
            } else {
                document.getElementById('noticeDisplay').innerText = "No notice available.";
            }
        });

        function updateNotice() {
            const newNotice = document.getElementById('noticeInput').value;
            if (!newNotice) return alert("Please write a notice!");

            db.collection("settings").doc("notice").set({
                text: newNotice
            }).then(() => {
                alert("Notice updated successfully!");
                document.getElementById('noticeInput').value = "";
            }).catch((error) => {
                alert("Error updating notice: " + error.message);
            });
        }

        // Add Match Function (Admin)
        function addNewMatch() {
            const title = document.getElementById('matchTitle').value;
            const entry = document.getElementById('matchEntry').value;
            const prize = document.getElementById('matchPrize').value;
            const maxSlots = parseInt(document.getElementById('maxSlots').value);
            const matchTime = document.getElementById('matchTime').value;

            if (!title || !entry || !prize || !maxSlots || !matchTime) {
                alert("Please fill in all fields!");
                return;
            }

            db.collection("tournaments").add({
                title: title,
                entryFee: entry,
                prizePool: prize,
                maxSlots: maxSlots,
                currentSlots: 0,
                matchTime: matchTime,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Match added successfully!");
                // Clear inputs
                document.getElementById('matchTitle').value = '';
                document.getElementById('matchEntry').value = '';
                document.getElementById('matchPrize').value = '';
                document.getElementById('maxSlots').value = '';
                document.getElementById('matchTime').value = '';
            }).catch((error) => {
                alert("Error adding match: " + error.message);
            });
        }

        // Delete Match Function (Admin)
        function deleteMatch(matchId) {
            if (confirm("Are you sure you want to delete this match?")) {
                db.collection("tournaments").doc(matchId).delete().then(() => {
                    alert("Match deleted successfully!");
                }).catch((error) => {
                    alert("Error deleting match: " + error.message);
                });
            }
        }

        // Join Match Function (User with Slot Limit & Transaction)
        function joinMatch(matchId) {
            if (!currentUser) {
                alert("Please login first to join the match!");
                googleLogin();
                return;
            }

            const matchRef = db.collection("tournaments").doc(matchId);

            db.runTransaction(async (transaction) => {
                const matchDoc = await transaction.get(matchRef);
                if (!matchDoc.exists) {
                    throw "Match does not exist!";
                }

                const data = matchDoc.data();
                const current = data.currentSlots || 0;
                const max = data.maxSlots || 50;

                if (current >= max) {
                    throw "Sorry, all slots are full!";
                }

                transaction.update(matchRef, { currentSlots: current + 1 });
            }).then(() => {
                alert("Successfully joined the match!");
            }).catch((error) => {
                alert("Failed to join: " + error);
            });
        }

        // Real-time Match List Renderer with Countdowns and Dynamic Slots
        db.collection("tournaments").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById('tournamentsList');
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm">No active tournaments found.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const match = doc.data();
                const matchId = doc.id;
                const current = match.currentSlots || 0;
                const max = match.maxSlots || 50;
                const percent = (current / max) * 100;

                // Admin delete button check
                let deleteBtnHtml = "";
                if (currentUser && adminEmails.includes(currentUser.email)) {
                    deleteBtnHtml = `<button onclick="deleteMatch('${matchId}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded text-xs transition">Delete</button>`;
                }

                const cardHtml = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow-md">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-100">${match.title}</h4>
                                <p class="text-xs text-slate-400">Time: <span id="timer-${matchId}" class="text-emerald-400 font-semibold">Calculating...</span></p>
                            </div>
                            ${deleteBtnHtml}
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">
                            <div><span class="text-slate-400">Entry:</span> ৳${match.entryFee}</div>
                            <div><span class="text-slate-400">Prize:</span> ৳${match.prizePool}</div>
                        </div>
                        <!-- Slot System View -->
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs text-slate-400">
                                <span>Slots Filled</span>
                                <span class="font-bold text-slate-200">${current} / ${max}</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        <button onclick="joinMatch('${matchId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition">
                            LOGIN TO JOIN
                        </button>
                    </div>
                `;
                container.innerHTML += cardHtml;

                // Start Countdown Timer for each match
                if (match.matchTime) {
                    startCountdown(matchId, match.matchTime);
                }
            });
        });

        // Countdown Timer Logic
        function startCountdown(matchId, matchTimeString) {
            const countDownDate = new Date(matchTimeString).getTime();

            const x = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                const timerElement = document.getElementById("timer-" + matchId);
                if (!timerElement) {
                    clearInterval(x);
                    return;
                }

                if (distance < 0) {
                    clearInterval(x);
                    timerElement.innerHTML = "Match Started!";
                } else {
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    timerElement.innerHTML = `${hours}h ${minutes}m ${seconds}s`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
