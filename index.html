<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-TOURNAMENT - User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400">AG-TOURNAMENT</h1>
        <div class="flex items-center gap-3">
            <button id="loginBtn" onclick="googleLogin()" class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-lg text-sm font-semibold transition">Login</button>
            <a id="adminLink" href="admin.html" class="hidden bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Admin Panel</a>
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Logout</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Notice Board -->
        <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex items-start gap-3">
            <span class="bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded uppercase">NOTICE</span>
            <p id="noticeDisplay" class="text-sm text-amber-200 font-medium">Loading Notice...</p>
        </div>

        <h3 class="text-base font-bold text-slate-200 pt-2">Live Tournaments</h3>
        <div id="tournamentsList" class="space-y-4">
            <!-- Matches load dynamically -->
        </div>
    </main>

    <!-- Participants Modal -->
    <div id="participantsModal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 w-full max-w-md p-5 rounded-xl border border-slate-700">
            <h3 class="text-lg font-bold mb-3 text-emerald-400">Joined Participants</h3>
            <ul id="participantsList" class="space-y-2 max-h-60 overflow-y-auto mb-4 text-sm">
                <!-- List items -->
            </ul>
            <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 w-full py-2 rounded-lg text-sm font-bold">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForAGTournament",
            authDomain: "ag-tournament-999.firebaseapp.com",
            projectId: "ag-tournament-999",
            storageBucket: "ag-tournament-999.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const adminEmail = "abujar2578@gmail.com";

        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                if (user.email === adminEmail) {
                    document.getElementById('adminLink').classList.remove('hidden');
                }
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('adminLink').classList.add('hidden');
            }
        });

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider).catch((error) => alert("Login Failed: " + error.message));
        }

        function logout() {
            auth.signOut();
        }

        // Notice Listener
        db.collection("settings").doc("notice").onSnapshot((doc) => {
            if (doc.exists) {
                document.getElementById('noticeDisplay').innerText = doc.data().text;
            } else {
                document.getElementById('noticeDisplay').innerText = "No notice available.";
            }
        });

        // Load Matches & Slot System
        db.collection("tournaments").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById('tournamentsList');
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm">No active tournaments found.</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const match = doc.data();
                const matchId = doc.id;
                const joinedUsers = match.joinedUsers || [];
                const current = joinedUsers.length;
                const max = match.maxSlots || 50;
                const percent = (current / max) * 100;
                const hasJoined = currentUser && joinedUsers.some(u => u.uid === currentUser.uid);
                const isFull = current >= max;

                const cardHtml = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3 shadow-md">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-100">${match.title}</h4>
                                <p class="text-xs text-slate-400">Time: <span id="timer-${matchId}" class="text-emerald-400 font-semibold">Calculating...</span></p>
                            </div>
                            <button onclick="openMoreModal('${matchId}')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs font-semibold">
                                <i class="fa-solid fa-users mr-1"></i> More (${current})
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">
                            <div><span class="text-slate-400">Entry:</span> ৳${match.entryFee}</div>
                            <div><span class="text-slate-400">Prize:</span> ৳${match.prizePool}</div>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs text-slate-400">
                                <span>Slots Filled</span>
                                <span class="font-bold text-slate-200">${current} / ${max}</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                        </div>
                        ${hasJoined ? 
                            `<div class="w-full bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 text-center py-2 rounded-lg text-sm font-bold">Joined Successfully</div>` :
                            `<button onclick="joinMatch('${matchId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-sm transition ${isFull ? 'opacity-50 cursor-not-allowed' : ''}">
                                ${isFull ? 'SLOT FULL' : 'LOGIN TO JOIN'}
                            </button>`
                        }
                    </div>
                `;
                container.innerHTML += cardHtml;

                if (match.matchTime) {
                    startCountdown(matchId, match.matchTime);
                }
            });
        });

        function joinMatch(matchId) {
            if (!currentUser) {
                alert("Please login first to join the match!");
                googleLogin();
                return;
            }

            const matchRef = db.collection("tournaments").doc(matchId);
            db.runTransaction(async (transaction) => {
                const matchDoc = await transaction.get(matchRef);
                if (!matchDoc.exists) throw "Match does not exist!";

                const data = matchDoc.data();
                const joinedUsers = data.joinedUsers || [];
                const max = data.maxSlots || 50;

                if (joinedUsers.length >= max) throw "Sorry, all slots are full!";
                if (joinedUsers.some(u => u.uid === currentUser.uid)) throw "You have already joined this match!";

                joinedUsers.push({
                    uid: currentUser.uid,
                    name: currentUser.displayName || "User",
                    email: currentUser.email
                });

                transaction.update(matchRef, { joinedUsers: joinedUsers });
            }).then(() => {
                alert("Successfully joined the match!");
            }).catch((error) => {
                alert(error);
            });
        }

        function openMoreModal(matchId) {
            const modal = document.getElementById('participantsModal');
            const listEl = document.getElementById('participantsList');
            listEl.innerHTML = "<li class='text-slate-400'>Loading...</li>";
            modal.classList.remove('hidden');

            db.collection("tournaments").doc(matchId).get().then((doc) => {
                if (doc.exists) {
                    const users = doc.data().joinedUsers || [];
                    listEl.innerHTML = "";
                    if (users.length === 0) {
                        listEl.innerHTML = "<li class='text-slate-500'>No participants yet.</li>";
                        return;
                    }
                    users.forEach((user, index) => {
                        listEl.innerHTML += `<li class="bg-slate-900 p-2 rounded flex justify-between items-center text-xs border border-slate-700/50"><span>${index + 1}. ${user.name}</span> <span class="text-slate-500">${user.email}</span></li>`;
                    });
                }
            });
        }

        function closeModal() {
            document.getElementById('participantsModal').classList.add('hidden');
        }

        function startCountdown(matchId, matchTimeString) {
            const countDownDate = new Date(matchTimeString).getTime();
            const x = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;
                const timerElement = document.getElementById("timer-" + matchId);
                if (!timerElement) { clearInterval(x); return; }

                if (distance < 0) {
                    clearInterval(x);
                    timerElement.innerHTML = "Match Started!";
                } else {
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    timerElement.innerHTML = `${hours}h ${minutes}m ${seconds}s`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
