<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-TOURNAMENT - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-4">
        <!-- Top Nav -->
        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
            <h1 class="text-base font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-1"></i> Admin Panel</h1>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold">Home</a>
        </div>

        <!-- Admin Control Center -->
        <div id="adminContent" class="hidden space-y-4">
            <!-- Notice Update Box -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-2">
                <h3 class="text-sm font-bold text-slate-200">Update Notice</h3>
                <input type="text" id="noticeInput" placeholder="Write new notice..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="updateNotice()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm transition">Save Notice</button>
            </div>

            <!-- Add Match Box -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-slate-200">Create New Match</h3>
                <input type="text" id="matchTitle" placeholder="Match Title (e.g., Free Fire Solo)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="matchEntry" placeholder="Entry Fee (৳)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="number" id="matchPrize" placeholder="Prize Pool (৳)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="maxSlots" placeholder="Max Slots (e.g. 50)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    <input type="datetime-local" id="matchTime" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-300">
                </div>
                <button onclick="addNewMatch()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-slate-900 font-bold py-2 rounded-lg text-sm transition">Create Match</button>
            </div>

            <!-- Manage / Delete Existing Matches -->
            <div class="space-y-2">
                <h3 class="text-sm font-bold text-slate-200">Manage Matches (Delete)</h3>
                <div id="adminMatchesList" class="space-y-3">
                    <!-- Dynamic Match Cards with Delete -->
                </div>
            </div>
        </div>

        <!-- Access Denied Message -->
        <div id="accessDenied" class="bg-slate-800 border border-red-500/30 rounded-xl p-6 text-center space-y-3">
            <h2 class="text-lg font-bold text-red-400">Access Denied</h2>
            <p class="text-xs text-slate-400">Please login with the authorized admin account (`abujar2578@gmail.com`) to view this panel.</p>
            <button onclick="googleLogin()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Login with Google</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForAGTournament",
            authDomain: "ag-tournament-999.firebaseapp.com",
            projectId: "ag-tournament-999",
            storageBucket: "ag-tournament-999.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const adminEmail = "abujar2578@gmail.com";

        auth.onAuthStateChanged((user) => {
            if (user && user.email === adminEmail) {
                document.getElementById('adminContent').classList.remove('hidden');
                document.getElementById('accessDenied').classList.add('hidden');
                loadAdminMatches();
            } else {
                document.getElementById('adminContent').classList.add('hidden');
                document.getElementById('accessDenied').classList.remove('hidden');
            }
        });

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => alert("Login Failed: " + error.message));
        }

        function updateNotice() {
            const newNotice = document.getElementById('noticeInput').value;
            if (!newNotice) return alert("Please write a notice!");

            db.collection("settings").doc("notice").set({ text: newNotice }).then(() => {
                alert("Notice updated successfully!");
                document.getElementById('noticeInput').value = "";
            }).catch((error) => alert("Error: " + error.message));
        }

        function addNewMatch() {
            const title = document.getElementById('matchTitle').value;
            const entry = document.getElementById('matchEntry').value;
            const prize = document.getElementById('matchPrize').value;
            const maxSlots = parseInt(document.getElementById('maxSlots').value);
            const matchTime = document.getElementById('matchTime').value;

            if (!title || !entry || !prize || !maxSlots || !matchTime) {
                alert("Please fill in all fields!");
                return;
            }

            db.collection("tournaments").add({
                title: title,
                entryFee: entry,
                prizePool: prize,
                maxSlots: maxSlots,
                matchTime: matchTime,
                joinedUsers: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Match added successfully!");
                document.getElementById('matchTitle').value = '';
                document.getElementById('matchEntry').value = '';
                document.getElementById('matchPrize').value = '';
                document.getElementById('maxSlots').value = '';
                document.getElementById('matchTime').value = '';
            }).catch((error) => alert("Error: " + error.message));
        }

        function loadAdminMatches() {
            db.collection("tournaments").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const container = document.getElementById('adminMatchesList');
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center">No matches found.</p>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const match = doc.data();
                    const matchId = doc.id;
                    const joinedCount = match.joinedUsers ? match.joinedUsers.length : 0;

                    container.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-slate-100">${match.title}</span>
                                <div class="text-slate-400 mt-0.5">Joined: ${joinedCount} / ${match.maxSlots}</div>
                            </div>
                            <button onclick="deleteMatch('${matchId}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg transition font-semibold">Delete</button>
                        </div>
                    `;
                });
            });
        }

        function deleteMatch(matchId) {
            if (confirm("Are you sure you want to delete this match?")) {
                db.collection("tournaments").doc(matchId).delete().then(() => {
                    alert("Match deleted successfully!");
                }).catch((error) => alert("Error: " + error.message));
            }
        }
    </script>
</body>
</html>
