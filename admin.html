<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Admin Panel</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: var(--card-bg); border: 1px solid rgba(0,243,255,0.3); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(0,243,255,0.1); }
        .login-box h2 { color: var(--neon-cyan); margin-bottom: 20px; text-align: center; }
        
        #adminDashboard { display: none; max-width: 1200px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 15px; }
        .dashboard-header h2 { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .admin-card { background: var(--card-bg); border: 2px solid var(--neon-green); border-radius: 12px; padding: 20px; box-shadow: 0 0 15px rgba(0,255,102,0.1); transition: 0.3s; }
        .admin-card:hover { box-shadow: 0 0 25px rgba(0,255,102,0.3); }
        .admin-card h3 { font-size: 16px; color: var(--neon-cyan); margin-bottom: 15px; text-align: center; border-bottom: 1px dashed #374151; padding-bottom: 8px; }
        
        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 14px; }
        .form-control:focus { border-color: var(--neon-cyan); outline: none; }
        
        .admin-btn { width: 100%; padding: 10px; background: var(--neon-green); color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .admin-btn:hover { opacity: 0.9; }
        
        .list-container { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .list-item { background: #1f2937; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border-left: 3px solid var(--neon-cyan); display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 5px; }
        .btn-approve { background: var(--neon-green); border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
        .btn-fail { background: var(--neon-pink); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="adminUser" class="form-control" placeholder="Admin ID">
            <input type="password" id="adminPass" class="form-control" placeholder="Password">
            <button class="admin-btn" onclick="checkAdminLogin()">Login</button>
        </div>
    </div>

    <div id="adminDashboard">
        <div class="dashboard-header">
            <h2>ZEG-G ADMIN PANEL</h2>
            <button onclick="logoutAdmin()" style="background: var(--neon-pink); color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <div class="admin-grid">
            
            <!-- Notice Control Card -->
            <div class="admin-card" style="border-color: var(--neon-cyan);">
                <h3>Update Notice Bar</h3>
                <textarea id="noticeInput" class="form-control" placeholder="Write site notice here..." rows="3"></textarea>
                <button class="admin-btn" style="background: var(--neon-cyan);" onclick="updateSiteNotice()">Update Notice</button>
            </div>

            <!-- Gift Code Creation Card -->
            <div class="admin-card" style="border-color: var(--neon-pink);">
                <h3>Create Gift Code</h3>
                <input type="text" id="giftCodeText" class="form-control" placeholder="Gift Code (e.g., ZEG50)">
                <input type="number" id="giftCodeAmount" class="form-control" placeholder="Bonus Amount (৳)">
                <button class="admin-btn" style="background: var(--neon-pink); color: #fff;" onclick="createGiftCode()">Create Code</button>
            </div>

            <!-- 1. Input Match Id & Password -->
            <div class="admin-card">
                <h3>Input Match Id & Password</h3>
                <div class="list-container" id="roomControlList"><p style="color: var(--text-muted); text-align: center;">Loading matches...</p></div>
            </div>

            <!-- 2. Add Match -->
            <div class="admin-card">
                <h3>Add Match</h3>
                <input type="text" id="mCode" class="form-control" placeholder="Match Code (e.g. M01)">
                <input type="text" id="mName" class="form-control" placeholder="Match Name">
                <input type="number" id="mFee" class="form-control" placeholder="Entry Fee (৳)">
                <input type="text" id="mFirstPrize" class="form-control" placeholder="First Prize">
                <input type="datetime-local" id="mTime" class="form-control">
                <input type="number" id="mSlots" class="form-control" placeholder="Total Slots (e.g. 48)">
                <button class="admin-btn" onclick="addNewMatchToDB()">Create Match</button>
            </div>

            <!-- 3. Add Balance Request -->
            <div class="admin-card">
                <h3>Add Balance Request</h3>
                <div class="list-container" id="addBalanceRequestsList"><p style="color: var(--text-muted); text-align: center;">Loading...</p></div>
            </div>

            <!-- 4. Withdraw Request -->
            <div class="admin-card">
                <h3>Withdraw Request</h3>
                <div class="list-container" id="withdrawRequestsList"><p style="color: var(--text-muted); text-align: center;">Loading...</p></div>
            </div>

            <!-- 5. Add User Balance -->
            <div class="admin-card">
                <h3>Add User Balance</h3>
                <input type="text" id="targetUserUID" class="form-control" placeholder="Enter User Game UID">
                <input type="number" id="bonusAmount" class="form-control" placeholder="Amount (৳) [Use minus for cut]">
                <button class="admin-btn" onclick="modifyUserBalance()">Update Balance</button>
            </div>

            <!-- 6. Search User And Block, Unblock -->
            <div class="admin-card">
                <h3>Search User & Block/Unblock</h3>
                <input type="text" id="searchUidInput" class="form-control" placeholder="Enter Game UID">
                <button class="admin-btn" onclick="searchUserByUID()">Search User</button>
                <div id="searchResultBox" style="margin-top: 10px; font-size: 13px; color: var(--text-muted);"></div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
          authDomain: "zeg-g-tournament.firebaseapp.com",
          projectId: "zeg-g-tournament",
          storageBucket: "zeg-g-tournament.firebasestorage.app",
          messagingSenderId: "907178832675",
          appId: "1:907178832675:web:414bc01f1b3a4695455296",
          measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = function() {
            if(sessionStorage.getItem("isAdminLoggedIn") === "true") {
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                loadAdminData();
            }
        }

        window.checkAdminLogin = function() {
            if(document.getElementById("adminUser").value.trim() === "9133" && document.getElementById("adminPass").value.trim() === "909090") {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                loadAdminData();
            } else { alert("ভুল আইডি বা পাসওয়ার্ড!"); }
        }

        window.logoutAdmin = function() { sessionStorage.removeItem("isAdminLoggedIn"); location.reload(); }

        // Notice Update Function
        window.updateSiteNotice = async function() {
            const noticeText = document.getElementById("noticeInput").value.trim();
            try {
                await setDoc(doc(db, "settings", "notice"), { text: noticeText });
                alert("নোটিশ সফলভাবে আপডেট হয়েছে!");
            } catch(e) { alert("Error: " + e.message); }
        }

        // Gift Code Create Function
        window.createGiftCode = async function() {
            const code = document.getElementById("giftCodeText").value.trim();
            const amount = Number(document.getElementById("giftCodeAmount").value);
            if(!code || !amount) { alert("কোড এবং অ্যামাউন্ট দিন।"); return; }
            try {
                await setDoc(doc(db, "giftCodes", code), {
                    code: code,
                    amount: amount,
                    isUsed: false,
                    createdAt: new Date()
                });
                alert("গিফট কোড সফলভাবে তৈরি হয়েছে!");
                document.getElementById("giftCodeText").value = "";
                document.getElementById("giftCodeAmount").value = "";
            } catch(e) { alert("Error: " + e.message); }
        }

        // 1. Match Create
        window.addNewMatchToDB = async function() {
            const code = document.getElementById("mCode").value.trim();
            const name = document.getElementById("mName").value.trim();
            const fee = Number(document.getElementById("mFee").value);
            const slots = Number(document.getElementById("mSlots").value);

            if(!code || !name) { alert("কোড এবং নাম দিন।"); return; }

            try {
                await setDoc(doc(db, "matches", code), {
                    matchCode: code, matchName: name, entryFee: fee,
                    firstPrize: document.getElementById("mFirstPrize").value.trim(),
                    matchTime: document.getElementById("mTime").value,
                    totalSlots: slots, joinedCount: 0, roomId: "", roomPass: ""
                });
                alert("ম্যাচ সফলভাবে তৈরি হয়েছে!");
                location.reload();
            } catch(e) { alert("Error: " + e.message); }
        }

        // 2. Room ID & Pass Update
        window.setRoomCreds = async function(matchId) {
            const rId = document.getElementById(`rid_${matchId}`).value.trim();
            const rPass = document.getElementById(`rpass_${matchId}`).value.trim();
            try {
                await updateDoc(doc(db, "matches", matchId), { roomId: rId, roomPass: rPass });
                alert("রুম আইডি ও পাসওয়ার্ড সেভ হয়েছে!");
            } catch(e) { alert("Error: " + e.message); }
        }

        window.deleteMatch = async function(matchId) {
            if(confirm("ম্যাচটি ডিলিট করতে চান?")) { await deleteDoc(doc(db, "matches", matchId)); loadAdminData(); }
        }

        // 3. Add Balance Request Processing
        window.processAddBalance = async function(reqId, userId, amount, status) {
            try {
                const reqRef = doc(db, "addBalanceRequests", reqId);
                if(status === 'Approved') {
                    const userRef = doc(db, "users", userId);
                    const userSnap = await getDoc(userRef);
                    let currentBal = userSnap.exists() ? Number(userSnap.data().balance || 0) : 0;
                    await updateDoc(userRef, { balance: currentBal + Number(amount) });
                    await updateDoc(reqRef, { status: 'Approved' });
                    alert("ব্যালেন্স এপ্রুভ করা হয়েছে!");
                } else {
                    await updateDoc(reqRef, { status: 'Fail' });
                    alert("রিকুয়েষ্টটি ফেইল করা হয়েছে।");
                }
                loadAdminData();
            } catch(e) { alert("Error: " + e.message); }
        }

        // 4. Withdraw Request Processing
        window.processWithdraw = async function(reqId, userId, amount, status) {
            try {
                const reqRef = doc(db, "withdrawRequests", reqId);
                if(status === 'Approved') {
                    await updateDoc(reqRef, { status: 'Approved' });
                    alert("উইথড্র এপ্রুভ হয়েছে!");
                } else {
                    const userRef = doc(db, "users", userId);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        let currentBal = Number(userSnap.data().balance || 0);
                        await updateDoc(userRef, { balance: currentBal + Number(amount) });
                    }
                    await updateDoc(reqRef, { status: 'Fail' });
                    alert("উইথড্র ফেইল ও ব্যালেন্স রিফান্ড করা হয়েছে।");
                }
                loadAdminData();
            } catch(e) { alert("Error: " + e.message); }
        }

        // 5. Direct Add/Cut User Balance by UID
        window.modifyUserBalance = async function() {
            const uid = document.getElementById("targetUserUID").value.trim();
            const amount = Number(document.getElementById("bonusAmount").value);
            if(!uid || isNaN(amount)) { alert("সঠিক UID এবং অ্যামাউন্ট দিন।"); return; }

            try {
                const q = query(collection(db, "users"), where("playerUID", "==", uid));
                const snap = await getDocs(q);
                if(snap.empty) { alert("এই UID-এর কোনো ইউজার পাওয়া যায়নি!"); return; }

                let userDocRef = snap.docs[0].ref;
                let currentBal = Number(snap.docs[0].data().balance || 0);
                await updateDoc(userDocRef, { balance: currentBal + amount });
                alert(`সফলভাবে ব্যালেন্স আপডেট করা হয়েছে! নতুন ব্যালেন্স: ৳${currentBal + amount}`);
                document.getElementById("targetUserUID").value = "";
                document.getElementById("bonusAmount").value = "";
            } catch(e) { alert("Error: " + e.message); }
        }

        // 6. Search User & Block / Unblock
        window.searchUserByUID = async function() {
            const uid = document.getElementById("searchUidInput").value.trim();
            const resultBox = document.getElementById("searchResultBox");
            if(!uid) { alert("Game UID লিখুন।"); return; }

            resultBox.innerHTML = "Searching...";
            try {
                const q = query(collection(db, "users"), where("playerUID", "==", uid));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    resultBox.innerHTML = `<span style="color: var(--neon-pink);">ইউজার পাওয়া যায়নি!</span>`;
                } else {
                    querySnapshot.forEach((docSnap) => {
                        const userData = docSnap.data();
                        const docId = docSnap.id;
                        const isBlocked = userData.isBlocked || false;
                        
                        resultBox.innerHTML = `
                            <div style="background: #1f2937; padding: 10px; border-radius: 6px; border-left: 3px solid var(--neon-green); margin-top: 5px;">
                                <strong style="color: var(--neon-cyan);">Name:</strong> ${userData.playerName || 'N/A'}<br>
                                <strong style="color: var(--neon-cyan);">UID:</strong> ${userData.playerUID}<br>
                                <strong style="color: var(--neon-cyan);">Balance:</strong> ৳${userData.balance || 0}<br>
                                <strong style="color: var(--neon-cyan);">Status:</strong> ${isBlocked ? '<span style="color:red">Blocked</span>' : '<span style="color:green">Active</span>'}<br>
                                <button class="admin-btn" style="background: ${isBlocked ? 'var(--neon-green)' : 'var(--neon-pink)'}; margin-top:8px; padding:6px;" onclick="toggleBlockUser('${docId}', ${isBlocked})">
                                    ${isBlocked ? 'Unblock User' : 'Block User'}
                                </button>
                            </div>`;
                    });
                }
            } catch(e) {
                resultBox.innerHTML = `<span style="color: var(--neon-pink);">Error: ${e.message}</span>`;
            }
        }

        window.toggleBlockUser = async function(docId, currentStatus) {
            try {
                await updateDoc(doc(db, "users", docId), { isBlocked: !currentStatus });
                alert("ইউজার স্ট্যাটাস পরিবর্তন করা হয়েছে!");
                searchUserByUID();
            } catch(e) { alert("Error: " + e.message); }
        }

        // Load All Admin Lists
        async function loadAdminData() {
            // Load existing notice into textarea
            try {
                const noticeDoc = await getDoc(doc(db, "settings", "notice"));
                if(noticeDoc.exists()) {
                    document.getElementById("noticeInput").value = noticeDoc.data().text || "";
                }
            } catch(e) {}

            // Room Control List
            const roomListContainer = document.getElementById("roomControlList");
            const snapMatch = await getDocs(collection(db, "matches"));
            roomListContainer.innerHTML = snapMatch.empty ? `<p style="color:var(--text-muted); text-align:center;">কোনো ম্যাচ নেই।</p>` : "";
            snapMatch.forEach(d => {
                const m = d.data();
                roomListContainer.innerHTML += `
                    <div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 6px;">
                        <strong style="color: var(--neon-cyan);">${m.matchName} (${m.matchCode})</strong>
                        <input type="text" id="rid_${m.matchCode}" class="form-control" placeholder="Room ID" value="${m.roomId || ''}" style="margin:2px 0; padding:5px; font-size:12px;">
                        <input type="text" id="rpass_${m.matchCode}" class="form-control" placeholder="Password" value="${m.roomPass || ''}" style="margin:2px 0; padding:5px; font-size:12px;">
                        <div style="display: flex; gap: 5px; width: 100%;">
                            <button class="btn-approve" style="flex:1; padding:4px;" onclick="setRoomCreds('${m.matchCode}')">Save</button>
                            <button class="btn-fail" style="padding:4px;" onclick="deleteMatch('${m.matchCode}')">Delete</button>
                        </div>
                    </div>`;
            });

            // Add Balance Requests
            const addBalContainer = document.getElementById("addBalanceRequestsList");
            const snapBal = await getDocs(collection(db, "addBalanceRequests"));
            addBalContainer.innerHTML = snapBal.empty ? `<p style="color:var(--text-muted); text-align:center;">কোনো রিকুয়েষ্ট নেই।</p>` : "";
            snapBal.forEach(d => {
                const data = d.data();
                if(data.status === 'Pending') {
                    addBalContainer.innerHTML += `
                        <div class="list-item">
                            <div>Trx: ${data.trxId} | ৳${data.amount}</div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="processAddBalance('${d.id}', '${data.userId}', ${data.amount}, 'Approved')">Approve</button>
                                <button class="btn-fail" onclick="processAddBalance('${d.id}', '${data.userId}', ${data.amount}, 'Fail')">Fail</button>
                            </div>
                        </div>`;
                }
            });

            // Withdraw Requests
            const withdrawContainer = document.getElementById("withdrawRequestsList");
            const snapWith = await getDocs(collection(db, "withdrawRequests"));
            withdrawContainer.innerHTML = snapWith.empty ? `<p style="color:var(--text-muted); text-align:center;">কোনো রিকুয়েষ্ট নেই।</p>` : "";
            snapWith.forEach(d => {
                const data = d.data();
                if(data.status === 'Pending') {
                    withdrawContainer.innerHTML += `
                        <div class="list-item">
                            <div>${data.number} | ৳${data.amount}</div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="processWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'Approved')">Approve</button>
                                <button class="btn-fail" onclick="processWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'Fail')">Fail</button>
                            </div>
                        </div>`;
                    }
            });
        }
    </script>
</body>
</html>
