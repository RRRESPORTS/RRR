<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEG-G Tournament Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    background:#101722;
    padding:18px;
    border-bottom:1px solid #293448;
}

.logo{
    color:#00e5ff;
    font-size:23px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.login{
    max-width:400px;
    margin:80px auto;
    background:#111722;
    padding:25px;
    border-radius:15px;
    border:1px solid #293448;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:7px 0;
    background:#0b1019;
    color:#fff;
    border:1px solid #293448;
    border-radius:8px;
}

textarea{
    min-height:120px;
}

button{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin:3px;
}

.primary{
    background:#00e5ff;
    color:#001014;
}

.danger{
    background:#ff4655;
    color:white;
}

.dark{
    background:#222c3d;
    color:white;
}

.panel{
    display:none;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.card{
    background:#111722;
    border:1px solid #293448;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
}

h2{
    border-left:4px solid #00e5ff;
    padding-left:10px;
}

.small{
    color:#9da8ba;
    font-size:13px;
}

.status{
    padding:5px 8px;
    border-radius:6px;
    background:#172235;
    display:inline-block;
}
</style>
</head>

<body>

<header>
    <div class="logo">ZEG-G TOURNAMENT — ADMIN</div>
</header>

<div class="container">

<!-- ADMIN LOGIN -->

<div id="loginBox" class="login">

<h2>Admin Login</h2>

<input
    id="email"
    type="email"
    placeholder="Admin Email"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button class="primary" onclick="adminLogin()">
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="panel">

<div class="tabs">

<button class="primary" onclick="showTab('website')">
Website
</button>

<button class="dark" onclick="showTab('matches')">
Matches
</button>

<button class="dark" onclick="showTab('payments')">
Payments
</button>

<button class="dark" onclick="showTab('users')">
Users
</button>

<button class="dark" onclick="showTab('withdrawals')">
Withdrawals
</button>

<button class="danger" onclick="logout()">
Logout
</button>

</div>


<!-- WEBSITE -->

<section id="website">

<h2>Website Settings</h2>

<div class="card">

<label>Notice</label>
<input id="notice" placeholder="Website Notice">

<label>Hero Title</label>
<input id="heroTitle" placeholder="Hero Title">

<label>Hero Text</label>
<input id="heroText" placeholder="Hero Text">

<label>Hero Image URL</label>
<input id="heroImage" placeholder="Image URL">

<label>Live Match URL</label>
<input id="liveUrl" placeholder="YouTube Live URL">

<label>App URL</label>
<input id="appUrl" placeholder="App Download URL">

<label>Telegram URL</label>
<input id="telegramUrl" placeholder="Telegram URL">

<label>Minimum Withdrawal</label>
<input
    id="minWithdrawal"
    type="number"
    placeholder="Minimum Withdrawal"
>

<label>Rules</label>
<textarea
    id="rules"
    placeholder="Rules & Conditions"
></textarea>

<button class="primary" onclick="saveWebsite()">
Save Website
</button>

</div>

</section>


<!-- MATCHES -->

<section id="matches" style="display:none">

<h2>Match Management</h2>

<div class="card">

<input
    id="matchTitle"
    placeholder="Match Title"
>

<select id="matchCategory">

<option value="normal">
Normal Match
</option>

<option value="1v1">
1 VS 1
</option>

<option value="headshot">
Headshot
</option>

</select>

<input
    id="matchCount"
    placeholder="Example: 48 Players"
>

<input
    id="entryFee"
    type="number"
    placeholder="Entry Fee"
>

<input
    id="matchImage"
    placeholder="Match Image URL"
>

<label>
<input
    id="matchEnabled"
    type="checkbox"
    checked
>
Enabled
</label>

<br>

<button class="primary" onclick="saveMatch()">
Add Match
</button>

</div>

<div id="matchList"></div>

</section>


<!-- PAYMENTS -->

<section id="payments" style="display:none">

<h2>Payment Methods</h2>

<div class="card">

<input
    id="paymentName"
    placeholder="bKash / Nagad"
>

<input
    id="paymentNumber"
    placeholder="Payment Number"
>

<button class="primary" onclick="addPayment()">
Add Payment Method
</button>

</div>

<div id="paymentList"></div>

</section>


<!-- USERS -->

<section id="users" style="display:none">

<h2>Users</h2>

<div id="userList"></div>

</section>


<!-- WITHDRAWALS -->

<section id="withdrawals" style="display:none">

<h2>Withdrawals</h2>

<div id="withdrawalList"></div>

</section>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDpOp2wyMj-7-5n4Vifpl6Ev2IB_hNg2TU",

    authDomain:
    "ag-tournament-999.firebaseapp.com",

    databaseURL:
    "https://ag-tournament-999-default-rtdb.firebaseio.com",

    projectId:
    "ag-tournament-999",

    storageBucket:
    "ag-tournament-999.firebasestorage.app",

    messagingSenderId:
    "761085533810",

    appId:
    "1:761085533810:web:c79e01d5ccca07f6416ceb",

    measurementId:
    "G-7M23XV9VS4"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =================================
   ADMIN EMAIL
================================= */

const ADMIN_EMAIL =
"abujar2578@gmail.com";


/* =================================
   ADMIN LOGIN
================================= */

window.adminLogin = async function(){

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;

    const message =
    document.getElementById("loginMessage");

    if(!email || !password){

        message.innerText =
        "Email and password required.";

        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.innerText =
        "Login successful.";

    }

    catch(error){

        console.error(error);

        message.innerText =
        error.message;
    }

};


/* =================================
   AUTH CHECK
================================= */

onAuthStateChanged(auth, function(user){

    if(
        user &&
        user.email &&
        user.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
    ){

        document.getElementById(
            "loginBox"
        ).style.display = "none";

        document.getElementById(
            "adminPanel"
        ).style.display = "block";

        loadWebsite();
        loadMatches();
        loadPayments();
        loadUsers();
        loadWithdrawals();

    }

    else{

        document.getElementById(
            "loginBox"
        ).style.display = "block";

        document.getElementById(
            "adminPanel"
        ).style.display = "none";

    }

});


/* =================================
   LOGOUT
================================= */

window.logout = async function(){

    await signOut(auth);

};


/* =================================
   TABS
================================= */

window.showTab = function(tab){

    const tabs = [
        "website",
        "matches",
        "payments",
        "users",
        "withdrawals"
    ];

    tabs.forEach(function(item){

        document.getElementById(item)
        .style.display =
        item === tab
        ? "block"
        : "none";

    });

};


/* =================================
   WEBSITE SETTINGS
================================= */

async function loadWebsite(){

    try{

        const snap =
        await getDoc(
            doc(db,"site","settings")
        );

        if(!snap.exists()) return;

        const d = snap.data();

        document.getElementById("notice")
        .value = d.notice || "";

        document.getElementById("heroTitle")
        .value = d.heroTitle || "";

        document.getElementById("heroText")
        .value = d.heroText || "";

        document.getElementById("heroImage")
        .value = d.heroImage || "";

        document.getElementById("liveUrl")
        .value = d.liveUrl || "";

        document.getElementById("appUrl")
        .value = d.appUrl || "";

        document.getElementById("telegramUrl")
        .value = d.telegramUrl || "";

        document.getElementById("minWithdrawal")
        .value = d.minWithdrawal || 0;

        document.getElementById("rules")
        .value = d.rules || "";

    }

    catch(error){

        console.error(error);

    }

}


window.saveWebsite = async function(){

    try{

        await setDoc(

            doc(db,"site","settings"),

            {

                notice:
                document.getElementById("notice").value,

                heroTitle:
                document.getElementById("heroTitle").value,

                heroText:
                document.getElementById("heroText").value,

                heroImage:
                document.getElementById("heroImage").value,

                liveUrl:
                document.getElementById("liveUrl").value,

                appUrl:
                document.getElementById("appUrl").value,

                telegramUrl:
                document.getElementById("telegramUrl").value,

                minWithdrawal:
                Number(
                    document.getElementById(
                        "minWithdrawal"
                    ).value
                ) || 0,

                rules:
                document.getElementById("rules").value,

                updatedAt:
                serverTimestamp()

            }

        );

        alert("Website settings saved.");

    }

    catch(error){

        alert(error.message);

    }

};


/* =================================
   MATCHES
================================= */

window.saveMatch = async function(){

    try{

        await addDoc(

            collection(db,"matches"),

            {

                title:
                document.getElementById(
                    "matchTitle"
                ).value,

                category:
                document.getElementById(
                    "matchCategory"
                ).value,

                countText:
                document.getElementById(
                    "matchCount"
                ).value,

                entryFee:
                Number(
                    document.getElementById(
                        "entryFee"
                    ).value
                ) || 0,

                image:
                document.getElementById(
                    "matchImage"
                ).value,

                enabled:
                document.getElementById(
                    "matchEnabled"
                ).checked,

                createdAt:
                serverTimestamp()

            }

        );

        alert("Match added successfully.");

        document.getElementById(
            "matchTitle"
        ).value = "";

        document.getElementById(
            "matchCount"
        ).value = "";

        document.getElementById(
            "entryFee"
        ).value = "";

        document.getElementById(
            "matchImage"
        ).value = "";

        loadMatches();

    }

    catch(error){

        alert(error.message);

    }

};


async function loadMatches(){

    const list =
    document.getElementById(
        "matchList"
    );

    list.innerHTML = "";

    try{

        const snap =
        await getDocs(
            collection(db,"matches")
        );

        snap.forEach(function(item){

            const d = item.data();

            const div =
            document.createElement("div");

            div.className = "card";

            div.innerHTML = `

                <b>${d.title || "Match"}</b>

                <p class="small">
                    Category:
                    ${d.category || ""}

                    <br>

                    Entry Fee:
                    ৳${d.entryFee || 0}

                    <br>

                    Status:
                    ${d.enabled === false
                    ? "Disabled"
                    : "Enabled"}
                </p>

                <button
                    class="danger"
                    onclick="deleteMatch('${item.id}')"
                >
                    Delete
                </button>

            `;

            list.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

    }

}


window.deleteMatch = async function(id){

    if(
        !confirm(
            "Are you sure you want to delete this match?"
        )
    ) return;

    await deleteDoc(
        doc(db,"matches",id)
    );

    loadMatches();

};


/* =================================
   PAYMENT METHODS
================================= */

window.addPayment = async function(){

    const name =
    document.getElementById(
        "paymentName"
    ).value.trim();

    const number =
    document.getElementById(
        "paymentNumber"
    ).value.trim();

    if(!name || !number){

        alert(
            "Payment name and number required."
        );

        return;
    }

    await addDoc(

        collection(
            db,
            "paymentMethods"
        ),

        {

            name:name,

            number:number,

            createdAt:
            serverTimestamp()

        }

    );

    document.getElementById(
        "paymentName"
    ).value = "";

    document.getElementById(
        "paymentNumber"
    ).value = "";

    loadPayments();

};


async function loadPayments(){

    const list =
    document.getElementById(
        "paymentList"
    );

    list.innerHTML = "";

    const snap =
    await getDocs(
        collection(
            db,
            "paymentMethods"
        )
    );

    snap.forEach(function(item){

        const d = item.data();

        const div =
        document.createElement("div");

        div.className = "card";

        div.innerHTML = `

            <b>${d.name || ""}</b>

            <p>
                ${d.number || ""}
            </p>

            <button
                class="danger"
                onclick="deletePayment('${item.id}')"
            >
                Delete
            </button>

        `;

        list.appendChild(div);

    });

}


window.deletePayment = async function(id){

    await deleteDoc(
        doc(
            db,
            "paymentMethods",
            id
        )
    );

    loadPayments();

};


/* =================================
   USERS
================================= */

async function loadUsers(){

    const list =
    document.getElementById(
        "userList"
    );

    list.innerHTML = "";

    const snap =
    await getDocs(
        collection(db,"users")
    );

    snap.forEach(function(item){

        const d = item.data();

        const div =
        document.createElement("div");

        div.className = "card";

        div.innerHTML = `

            <b>
                ${d.email || item.id}
            </b>

            <p>

                Balance:
                ৳${d.balance || 0}

                <br>

                Earn Balance:
                ৳${d.earnBalance || 0}

                <br>

                Verified:
                ${d.verified ? "Yes" : "No"}

            </p>

            <input
                id="bal_${item.id}"
                type="number"
                placeholder="New Balance"
            >

            <input
                id="earn_${item.id}"
                type="number"
                placeholder="New Earn Balance"
            >

            <button
                class="primary"
                onclick="updateUser('${item.id}')"
            >
                Update
            </button>

            <button
                class="dark"
                onclick="
                verifyUser(
                    '${item.id}',
                    ${!d.verified}
                )
                "
            >
                ${d.verified
                ? "Unverify"
                : "Verify"}

            </button>

        `;

        list.appendChild(div);

    });

}


window.updateUser = async function(id){

    const balanceValue =
    document.getElementById(
        "bal_"+id
    ).value;

    const earnValue =
    document.getElementById(
        "earn_"+id
    ).value;

    const update = {};

    if(balanceValue !== "")
        update.balance =
        Number(balanceValue);

    if(earnValue !== "")
        update.earnBalance =
        Number(earnValue);

    if(
        Object.keys(update).length === 0
    ){

        alert(
            "Enter a value first."
        );

        return;
    }

    await updateDoc(
        doc(db,"users",id),
        update
    );

    alert("User updated.");

    loadUsers();

};


window.verifyUser = async function(
    id,
    value
){

    await updateDoc(

        doc(
            db,
            "users",
            id
        ),

        {
            verified:value
        }

    );

    loadUsers();

};


/* =================================
   WITHDRAWALS
================================= */

async function loadWithdrawals(){

    const list =
    document.getElementById(
        "withdrawalList"
    );

    list.innerHTML = "";

    try{

        const snap =
        await getDocs(
            collection(
                db,
                "withdrawals"
            )
        );

        snap.forEach(function(item){

            const d = item.data();

            const div =
            document.createElement("div");

            div.className = "card";

            div.innerHTML = `

                <b>
                    ${d.email ||
                    d.uid ||
                    "User"}
                </b>

                <p>

                    Amount:
                    ৳${d.amount || 0}

                    <br>

                    Method:
                    ${d.method || ""}

                    <br>

                    Number:
                    ${d.number || ""}

                    <br>

                    Status:
                    ${d.status || "pending"}

                </p>

                <button
                    class="primary"
                    onclick="
                    withdrawAction(
                        '${item.id}',
                        'approved'
                    )
                    "
                >
                    Approve
                </button>

                <button
                    class="danger"
                    onclick="
                    withdrawAction(
                        '${item.id}',
                        'rejected'
                    )
                    "
                >
                    Reject
                </button>

            `;

            list.appendChild(div);

        });

    }

    catch(error){

        console.error(error);

    }

}


window.withdrawAction =
async function(id,status){

    await updateDoc(

        doc(
            db,
            "withdrawals",
            id
        ),

        {

            status:status,

            processedAt:
            serverTimestamp()

        }

    );

    loadWithdrawals();

};

</script>

</body>
</html>
