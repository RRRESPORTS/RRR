<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Admin Panel</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        h2 { color: var(--neon-cyan); margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .admin-card { background: var(--card-bg); border: 1px solid rgba(0,243,255,0.2); border-radius: 12px; padding: 20px; box-shadow: 0 0 15px rgba(0,243,255,0.05); }
        .admin-card h3 { font-size: 16px; color: var(--neon-pink); margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; }
        .admin-btn { width: 100%; padding: 10px; background: var(--neon-cyan); color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .list-item { background: #1f2937; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .btn-approve { background: var(--neon-green); border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-fail { background: var(--neon-pink); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>ZEG-G TOURNAMENT - ADMIN PANEL</h2>

    <div class="admin-grid">
        <!-- 1. Add Match Setting -->
        <div class="admin-card">
            <h3>Add Match Setting</h3>
            <input type="text" id="mCode" class="form-control" placeholder="Match Code">
            <input type="text" id="mName" class="form-control" placeholder="Match Name">
            <input type="number" id="mFee" class="form-control" placeholder="Entry Fee">
            <input type="text" id="mFirstPrize" class="form-control" placeholder="First Prize">
            <input type="text" id="mSecondPrize" class="form-control" placeholder="Second Prize">
            <input type="text" id="mSurprise" class="form-control" placeholder="Surprise Prize">
            <input type="datetime-local" id="mTime" class="form-control">
            <input type="number" id="mSlots" class="form-control" placeholder="Total Slots">
            <button class="admin-btn" onclick="addNewMatch()">Create Match</button>
        </div>

        <!-- 2. User Add Balance Control -->
        <div class="admin-card">
            <h3>User Add Balance Requests</h3>
            <div id="addBalanceRequestsList">
                <div class="list-item">
                    <span>User: abujar | Trx: TX12345 | ৳50</span>
                    <div>
                        <button class="btn-approve" onclick="alert('Approved!')">Accept</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Withdraw Request Control -->
        <div class="admin-card">
            <h3>Withdraw Requests</h3>
            <div id="withdrawRequestsList">
                <div class="list-item">
                    <span>01700000000 | ৳100</span>
                    <div>
                        <button class="btn-approve" onclick="alert('Approved!')">Approve</button>
                        <button class="btn-fail" onclick="alert('Failed!')">Fail</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. User Block Setting -->
        <div class="admin-card">
            <h3>User Block Settings</h3>
            <input type="text" id="blockUserEmail" class="form-control" placeholder="User Email or ID">
            <button class="admin-btn" style="background: var(--neon-pink); color: #fff;" onclick="blockUser()">Ban / Block User</button>
        </div>

        <!-- 5. Notice & Image Change Setting -->
        <div class="admin-card">
            <h3>Website Notice & Banner</h3>
            <textarea id="noticeText" class="form-control" placeholder="Update Notice Message..."></textarea>
            <input type="text" id="bannerImgUrl" class="form-control" placeholder="Banner Image URL">
            <button class="admin-btn" onclick="updateWebsiteSettings()">Update Site Data</button>
        </div>

        <!-- 6. Match Delete / Room ID Control -->
        <div class="admin-card">
            <h3>Match Control & Room IDs</h3>
            <input type="text" id="roomMatchId" class="form-control" placeholder="Match ID">
            <input type="text" id="roomIDPass" class="form-control" placeholder="Room ID & Password">
            <button class="admin-btn" onclick="updateRoomCreds()">Set Room Credentials</button>
            <button class="admin-btn" style="background: #ff007f; color: #fff; margin-top: 5px;" onclick="deleteMatch()">Delete Match</button>
        </div>
    </div>

    <script>
        function addNewMatch() {
            alert("Match created successfully and added to database.");
        }
        function updateWebsiteSettings() {
            alert("Website notice & banner updated!");
        }
        function blockUser() {
            alert("User has been banned.");
        }
        function updateRoomCreds() {
            alert("Room ID & Password updated!");
        }
        function deleteMatch() {
            alert("Match deleted successfully.");
        }
    </script>
</body>
</html>
