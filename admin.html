<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Admin Panel | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070913;
            --panel-bg: rgba(13, 17, 28, 0.85);
            --neon-purple: #9333ea;
            --neon-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(6, 182, 212, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

        aside { width: 260px; background: var(--panel-bg); border-right: 1px solid rgba(255, 255, 255, 0.05); padding: 30px 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .admin-logo { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }
        .menu-links { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .menu-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: 0.3s; font-size: 14px; }
        .menu-links a:hover, .menu-links a.active { background: rgba(6, 182, 212, 0.1); color: var(--neon-cyan); border-left: 3px solid var(--neon-cyan); }

        main { flex: 1; padding: 40px; overflow-y: auto; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        .top-header h2 { font-family: 'Orbitron', sans-serif; font-size: 22px; }

        .panel-section { background: var(--panel-bg); border: 1px solid var(--border-glow); padding: 25px; border-radius: 12px; }
        .panel-section label { font-size: 13px; color: var(--text-muted); }
        .panel-section input { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #070913; border: 1px solid var(--text-muted); color: #fff; border-radius: 8px; }
        
        .btn-action {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            color: #fff; border: none; padding: 12px 25px; border-radius: 8px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-action:hover { opacity: 0.8; box-shadow: 0 0 15px rgba(6,182,212,0.4); }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="admin-logo">ZEG-G ADMIN</div>
            <ul class="menu-links">
                <li><a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> Add Tournament</a></li>
                <li><a href="index.html"><i class="fa-solid fa-globe"></i> Visit Site</a></li>
            </ul>
        </div>
    </aside>

    <main>
        <div class="top-header">
            <h2>Admin Dashboard</h2>
            <span style="color: var(--neon-cyan); font-size: 14px;"><i class="fa-solid fa-shield-halved"></i> Connected</span>
        </div>

        <div class="panel-section" style="max-width: 550px;">
            <h3 style="font-family: 'Orbitron'; margin-bottom: 20px; font-size: 16px;">Create New Tournament</h3>
            
            <label>Tournament Name</label>
            <input type="text" id="t-name" placeholder="e.g. Free Fire Squad War">
            
            <label>Game Name</label>
            <input type="text" id="t-game" placeholder="e.g. Free Fire / PUBG">
            
            <label>Prize Pool (BDT)</label>
            <input type="number" id="t-prize" placeholder="e.g. 5000">

            <button class="btn-action" onclick="addTournament()">Publish to Live Site</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tomar original Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
            authDomain: "zeg-g-tournament.firebaseapp.com",
            projectId: "zeg-g-tournament",
            storageBucket: "zeg-g-tournament.firebasestorage.app",
            messagingSenderId: "907178832675",
            appId: "1:907178832675:web:414bc01f1b3a4695455296",
            measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addTournament = async function() {
            const name = document.getElementById('t-name').value;
            const game = document.getElementById('t-game').value;
            const prize = document.getElementById('t-prize').value;

            if(!name || !game || !prize) {
                alert("Please fill all fields!");
                return;
            }

            try {
                await addDoc(collection(db, "tournaments"), {
                    name: name,
                    game: game,
                    prize: prize,
                    createdAt: new Date()
                });
                alert("Tournament published successfully!");
                document.getElementById('t-name').value = '';
                document.getElementById('t-game').value = '';
                document.getElementById('t-prize').value = '';
            } catch (e) {
                alert("Error: " + e.message + "\nMake sure Firestore Database is created in your Firebase Console!");
            }
        }
    </script>
</body>
</html>
