<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEG-G Admin Panel</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-green: #00ff66;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: var(--card-bg); border: 1px solid rgba(0,243,255,0.3); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(0,243,255,0.1); }
        .login-box h2 { color: var(--neon-cyan); margin-bottom: 20px; text-align: center; }
        
        #adminDashboard { display: none; max-width: 1200px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 15px; }
        .dashboard-header h2 { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .admin-card { background: var(--card-bg); border: 1px solid rgba(0,243,255,0.2); border-radius: 12px; padding: 20px; box-shadow: 0 0 15px rgba(0,243,255,0.05); }
        .admin-card h3 { font-size: 16px; color: var(--neon-pink); margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
        
        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 14px; }
        .form-control:focus { border-color: var(--neon-cyan); outline: none; }
        
        .admin-btn { width: 100%; padding: 10px; background: var(--neon-cyan); color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        .list-container { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .list-item { background: #1f2937; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border-left: 3px solid var(--neon-cyan); display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 5px; }
        .btn-approve { background: var(--neon-green); border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
        .btn-fail { background: var(--neon-pink); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="adminUser" class="form-control" placeholder="Admin ID">
            <input type="password" id="adminPass" class="form-control" placeholder="Password">
            <button class="admin-btn" onclick="checkAdminLogin()">Login</button>
        </div>
    </div>

    <div id="adminDashboard">
        <div class="dashboard-header">
            <h2>ZEG-G ADMIN DASHBOARD</h2>
            <button onclick="logoutAdmin()" style="background: var(--neon-pink); color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <div class="admin-grid">
            <!-- Match Create Setting -->
            <div class="admin-card">
                <h3>🎮 Match Create Setting</h3>
                <input type="text" id="mCode" class="form-control" placeholder="Match Code (e.g. M01)">
                <input type="text" id="mName" class="form-control" placeholder="Match Name">
                <input type="number" id="mFee" class="form-control" placeholder="Entry Fee (৳)">
                <input type="text" id="mFirstPrize" class="form-control" placeholder="First Prize">
                <input type="text" id="mSecondPrize" class="form-control" placeholder="Second Prize">
                <input type="datetime-local" id="mTime" class="form-control">
                <input type="number" id="mSlots" class="form-control" placeholder="Total Slots (e.g. 48)">
                <button class="admin-btn" onclick="addNewMatchToDB()">Create Match</button>
            </div>

            <!-- Search User by Game UID -->
            <div class="admin-card">
                <h3>🔍 Search User by Game UID</h3>
                <input type="text" id="searchUidInput" class="form-control" placeholder="Enter Game UID">
                <button class="admin-btn" onclick="searchUserByUID()">Search User</button>
                <div id="searchResultBox" style="margin-top: 10px; font-size: 13px; color: var(--text-muted);"></div>
            </div>

            <!-- Add Balance Requests -->
            <div class="admin-card">
                <h3>💳 Add Balance Requests</h3>
                <div class="list-container" id="addBalanceRequestsList"><p style="color: var(--text-muted); text-align: center;">Loading...</p></div>
            </div>

            <!-- Withdraw Requests -->
            <div class="admin-card">
                <h3>💸 Withdraw Requests</h3>
                <div class="list-container" id="withdrawRequestsList"><p style="color: var(--text-muted); text-align: center;">Loading...</p></div>
            </div>

            <!-- Room ID & Match Control -->
            <div class="admin-card">
                <h3>🔑 Room ID & Match Control</h3>
                <div class="list-container" id="adminMatchList"><p style="color: var(--text-muted); text-align: center;">Loading...</p></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwAMUjmLJRVN3bC_uhaA0VxvGfnel156E",
          authDomain: "zeg-g-tournament.firebaseapp.com",
          projectId: "zeg-g-tournament",
          storageBucket: "zeg-g-tournament.firebasestorage.app",
          messagingSenderId: "907178832675",
          appId: "1:907178832675:web:414bc01f1b3a4695455296",
          measurementId: "G-PLN2DEP794"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = function() {
            if(sessionStorage.getItem("isAdminLoggedIn") === "true") {
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                loadAdminData();
            }
        }

        window.checkAdminLogin = function() {
            if(document.getElementById("adminUser").value.trim() === "9133" && document.getElementById("adminPass").value.trim() === "909090") {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                loadAdminData();
            } else { alert("Vul ID ba Password!"); }
        }

        window.logoutAdmin = function() { sessionStorage.removeItem("isAdminLoggedIn"); location.reload(); }

        window.addNewMatchToDB = async function() {
            const code = document.getElementById("mCode").value.trim();
            const name = document.getElementById("mName").value.trim();
            const fee = Number(document.getElementById("mFee").value);
            const slots = Number(document.getElementById("mSlots").value);

            if(!code || !name) { alert("Code ebong Name din."); return; }

            try {
                await setDoc(doc(db, "matches", code), {
                    matchCode: code, matchName: name, entryFee: fee,
                    firstPrize: document.getElementById("mFirstPrize").value.trim(),
                    secondPrize: document.getElementById("mSecondPrize").value.trim(),
                    matchTime: document.getElementById("mTime").value,
                    totalSlots: slots, joinedCount: 0, roomId: "", roomPass: ""
                });
                alert("Match created successfully!");
                location.reload();
            } catch(e) { alert("Error: " + e.message); }
        }

        // User Search by UID Feature
        window.searchUserByUID = async function() {
            const uid = document.getElementById("searchUidInput").value.trim();
            const resultBox = document.getElementById("searchResultBox");
            if(!uid) { alert("দয়া করে একটি Game UID লিখুন।"); return; }

            resultBox.innerHTML = "Searching...";
            try {
                const q = query(collection(db, "users"), where("playerUID", "==", uid));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    resultBox.innerHTML = `<span style="color: var(--neon-pink);">কোনো ইউজার পাওয়া যায়নি!</span>`;
                } else {
                    querySnapshot.forEach((docSnap) => {
                        const userData = docSnap.data();
                        resultBox.innerHTML = `
                            <div style="background: #1f2937; padding: 10px; border-radius: 6px; border-left: 3px solid var(--neon-green);">
                                <strong style="color: var(--neon-cyan);">Name:</strong> ${userData.playerName || 'N/A'}<br>
                                <strong style="color: var(--neon-cyan);">UID:</strong> ${userData.playerUID}<br>
                                <strong style="color: var(--neon-cyan);">Email:</strong> ${userData.email || 'N/A'}<br>
                                <strong style="color: var(--neon-cyan);">Balance:</strong> ৳${userData.balance || 0}
                            </div>`;
                    });
                }
            } catch(e) {
                resultBox.innerHTML = `<span style="color: var(--neon-pink);">Error: ${e.message}</span>`;
            }
        }

        window.processAddBalance = async function(reqId, userId, amount, status) {
            try {
                const reqRef = doc(db, "addBalanceRequests", reqId);
                if(status === 'Approved') {
                    const userRef = doc(db, "users", userId);
                    const userSnap = await getDoc(userRef);
                    let currentBal = userSnap.exists() ? Number(userSnap.data().balance || 0) : 0;
                    await updateDoc(userRef, { balance: currentBal + Number(amount) });
                    await updateDoc(reqRef, { status: 'Approved' });
                    alert("Add Balance Approved!");
                } else {
                    await updateDoc(reqRef, { status: 'Fail' });
                    alert("Add Balance marked as Fail.");
                }
                loadAdminData();
            } catch(e) { alert("Error: " + e.message); }
        }

        window.processWithdraw = async function(reqId, userId, amount, status) {
            try {
                const reqRef = doc(db, "withdrawRequests", reqId);
                if(status === 'Approved') {
                    await updateDoc(reqRef, { status: 'Approved' });
                    alert("Withdraw Approved!");
                } else {
                    const userRef = doc(db, "users", userId);
                    const userSnap = await getDoc(userRef);
                    if(userSnap.exists()) {
                        let currentBal = Number(userSnap.data().balance || 0);
                        await updateDoc(userRef, { balance: currentBal + Number(amount) });
                    }
                    await updateDoc(reqRef, { status: 'Fail' });
                    alert("Withdraw Failed & Amount refunded to user.");
                }
                loadAdminData();
            } catch(e) { alert("Error: " + e.message); }
        }

        window.setRoomCreds = async function(matchId) {
            const rId = document.getElementById(`rid_${matchId}`).value.trim();
            const rPass = document.getElementById(`rpass_${matchId}`).value.trim();
            try {
                await updateDoc(doc(db, "matches", matchId), { roomId: rId, roomPass: rPass });
                alert("Room ID & Password saved!");
            } catch(e) { alert("Error: " + e.message); }
        }

        window.deleteMatch = async function(matchId) {
            if(confirm("Delete match?")) { await deleteDoc(doc(db, "matches", matchId)); loadAdminData(); }
        }

        async function loadAdminData() {
            const addBalContainer = document.getElementById("addBalanceRequestsList");
            const snapBal = await getDocs(collection(db, "addBalanceRequests"));
            addBalContainer.innerHTML = snapBal.empty ? `<p style="color:var(--text-muted); text-align:center;">Kono request nei.</p>` : "";
            snapBal.forEach(d => {
                const data = d.data();
                const statusColor = data.status === 'Approved' ? 'var(--neon-green)' : (data.status === 'Fail' ? 'var(--neon-pink)' : 'var(--neon-cyan)');
                addBalContainer.innerHTML += `
                    <div class="list-item">
                        <div>Trx: ${data.trxId} | ৳${data.amount}<br><span style="font-size:11px; color:${statusColor};">Status: ${data.status}</span></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processAddBalance('${d.id}', '${data.userId}', ${data.amount}, 'Approved')">Approve</button>
                            <button class="btn-fail" onclick="processAddBalance('${d.id}', '${data.userId}', ${data.amount}, 'Fail')">Fail</button>
                        </div>
                    </div>`;
            });

            const withdrawContainer = document.getElementById("withdrawRequestsList");
            const snapWith = await getDocs(collection(db, "withdrawRequests"));
            withdrawContainer.innerHTML = snapWith.empty ? `<p style="color:var(--text-muted); text-align:center;">Kono request nei.</p>` : "";
            snapWith.forEach(d => {
                const data = d.data();
                const statusColor = data.status === 'Approved' ? 'var(--neon-green)' : (data.status === 'Fail' ? 'var(--neon-pink)' : 'var(--neon-cyan)');
                withdrawContainer.innerHTML += `
                    <div class="list-item">
                        <div>${data.number} | ৳${data.amount}<br><span style="font-size:11px; color:${statusColor};">Status: ${data.status}</span></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'Approved')">Approve</button>
                            <button class="btn-fail" onclick="processWithdraw('${d.id}', '${data.userId}', ${data.amount}, 'Fail')">Fail</button>
                        </div>
                    </div>`;
            });

            const matchListContainer = document.getElementById("adminMatchList");
            const snapMatch = await getDocs(collection(db, "matches"));
            matchListContainer.innerHTML = snapMatch.empty ? `<p style="color:var(--text-muted); text-align:center;">Kono match nei.</p>` : "";
            snapMatch.forEach(d => {
                const m = d.data();
                matchListContainer.innerHTML += `
                    <div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                        <strong style="color: var(--neon-cyan);">${m.matchName} (${m.matchCode}) - Slots: ${m.joinedCount || 0}/${m.totalSlots}</strong>
                        <input type="text" id="rid_${m.matchCode}" class="form-control" placeholder="Room ID" value="${m.roomId || ''}" style="margin:2px 0; padding:6px;">
                        <input type="text" id="rpass_${m.matchCode}" class="form-control" placeholder="Password" value="${m.roomPass || ''}" style="margin:2px 0; padding:6px;">
                        <div style="display: flex; gap: 5px; width: 100%; margin-top: 5px;">
                            <button class="btn-approve" style="flex:1;" onclick="setRoomCreds('${m.matchCode}')">Save</button>
                            <button class="btn-fail" onclick="deleteMatch('${m.matchCode}')">Delete</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
